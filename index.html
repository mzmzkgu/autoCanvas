<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Miri Creator — 키워드 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1a1a24;--surface3:#22222e;
  --border:#2a2a3a;--border-hover:#3a3a5a;
  --text:#e8e8f0;--text-dim:#8888a0;--text-muted:#555570;
  --accent:#00e5a0;--accent-dim:#00c088;--accent-glow:rgba(0,229,160,.12);
  --warn:#ffaa22;--warn-glow:rgba(255,170,34,.12);
  --friendship:#ff6b9d;--friendship-glow:rgba(255,107,157,.12);
  --thinking:#7c6ef7;--thinking-glow:rgba(124,110,247,.12);
  --discovery:#ffcc4d;--discovery-glow:rgba(255,204,77,.12);
  --investigate:#4dd0e1;--investigate-glow:rgba(77,208,225,.12);
  --radius:12px;--radius-sm:7px;
}
html,body{min-height:100%;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}
body{padding-bottom:60px}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(10,10,15,.88);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:12px
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.4px}
.logo-icon{
  width:30px;height:30px;border-radius:7px;
  background:var(--accent);
  display:grid;place-items:center;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--bg)
}
.header-meta{display:flex;align-items:center;gap:10px}
#updateTime{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted)}
.refresh-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text-dim);font-family:inherit;font-size:12px;font-weight:500;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s
}
.refresh-btn:active{transform:scale(.95)}
.refresh-btn svg{width:14px;height:14px}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MAIN ── */
main{max-width:760px;margin:0 auto;padding:20px 14px;display:flex;flex-direction:column;gap:20px}

/* ── SECTION HEADER ── */
.section-header{
  display:flex;align-items:center;gap:10px;margin-bottom:14px
}
.section-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid;letter-spacing:.2px;white-space:nowrap
}
.badge-growth{color:var(--accent);border-color:rgba(0,229,160,.35);background:var(--accent-glow)}
.badge-friendship{color:var(--friendship);border-color:rgba(255,107,157,.35);background:var(--friendship-glow)}
.badge-thinking{color:var(--thinking);border-color:rgba(124,110,247,.35);background:var(--thinking-glow)}
.badge-discovery{color:var(--discovery);border-color:rgba(255,204,77,.35);background:var(--discovery-glow)}
.badge-investigate{color:var(--investigate);border-color:rgba(77,208,225,.35);background:var(--investigate-glow)}
.section-desc{font-size:12px;color:var(--text-muted);line-height:1.4}

/* ── CARD ── */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:border-color .2s
}
.card:hover{border-color:var(--border-hover)}

.card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;border-bottom:1px solid var(--border);
  gap:10px
}
.card-title{
  display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px
}
.card-num{
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  flex-shrink:0
}
.num-growth{background:var(--accent-glow);color:var(--accent)}
.num-friendship{background:var(--friendship-glow);color:var(--friendship)}
.num-thinking{background:var(--thinking-glow);color:var(--thinking)}
.num-discovery{background:var(--discovery-glow);color:var(--discovery)}
.num-investigate{background:var(--investigate-glow);color:var(--investigate)}

.keyword-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;
  color:var(--text-dim);background:var(--surface3);border:1px solid var(--border)
}

/* ── CONTENT ROWS ── */
.card-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}

.row{display:flex;flex-direction:column;gap:6px}
.row-label{
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:1.1px;text-transform:uppercase;color:var(--text-muted)
}
.row-content{
  display:flex;align-items:flex-start;gap:8px
}
.text-box{
  flex:1;
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:13px;color:var(--text);line-height:1.55;
  font-family:'Outfit',sans-serif;word-break:keep-all
}
.copy-btn{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;gap:4px;
  padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface2);color:var(--text-dim);font-family:inherit;
  font-size:11px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:all .15s;white-space:nowrap;align-self:stretch
}
.copy-btn svg{width:14px;height:14px}
.copy-btn:active{transform:scale(.92)}
.copy-btn.copied{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}

/* ── LOADING / EMPTY ── */
.state-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px
}
.state-icon{font-size:36px}
.state-title{font-size:15px;font-weight:600}
.state-sub{font-size:13px;color:var(--text-muted);line-height:1.5}

/* skeleton */
.skel{background:var(--surface2);border-radius:6px;animation:skel 1.2s ease-in-out infinite}
@keyframes skel{0%,100%{opacity:.4}50%{opacity:.8}}

/* ── STATUS BAR ── */
.status-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:rgba(10,10,15,.9);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  height:44px;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted)
}
.status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  display:inline-block;margin-right:6px;
  animation:pulse 2s ease-in-out infinite
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.status-dot.offline{background:var(--text-muted);animation:none}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  padding:9px 18px;background:var(--surface3);border:1px solid var(--accent);
  border-radius:var(--radius);font-size:13px;color:var(--accent);
  z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap
}
.toast.show{opacity:1}

/* ── NEXT UPDATE COUNTDOWN ── */
.countdown-bar{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px
}
.countdown-label{font-size:12px;color:var(--text-muted)}
#countdown{
  font-family:'Space Mono',monospace;font-size:14px;color:var(--accent);font-weight:700
}
.progress-track{
  flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden
}
.progress-fill{
  height:100%;background:var(--accent);border-radius:2px;
  transition:width .5s ease;width:0%
}

@media(max-width:480px){
  .card-body{padding:12px 12px}
  .text-box{font-size:12px;padding:9px 10px}
  .copy-btn{font-size:11px;padding:8px 10px}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">MC</div>
    <span>Miri Creator</span>
  </div>
  <div class="header-meta">
    <span id="updateTime">—</span>
    <button class="refresh-btn" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>
      새로고침
    </button>
  </div>
</header>

<main id="mainContent">
  <!-- 로딩 스켈레톤 -->
  <div id="loadingState">
    <div class="countdown-bar" style="gap:12px">
      <div class="skel" style="width:80px;height:14px"></div>
      <div class="skel" style="flex:1;height:4px"></div>
      <div class="skel" style="width:60px;height:14px"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="skel" style="height:180px;border-radius:12px"></div>
      <div class="skel" style="height:180px;border-radius:12px"></div>
      <div class="skel" style="height:180px;border-radius:12px"></div>
    </div>
  </div>
  <div id="dataContent" style="display:none;flex-direction:column;gap:20px"></div>
</main>

<div class="status-bar">
  <div><span class="status-dot" id="statusDot"></span><span id="statusText">데이터 로딩 중...</span></div>
  <div id="statusRight">—</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
// 라파 서버에서 생성한 JSON 파일 URL (GitHub raw 또는 GitHub Pages 경로)
const DATA_URL = 'https://raw.githubusercontent.com/mzmzkgu/autoCanvas/main/data/keywords.json';
// 개발/테스트용 fallback 데이터
const FALLBACK_DATA = {
  updatedAt: new Date().toISOString(),
  nextUpdateAt: (() => {
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    if (d <= new Date()) d.setDate(d.getDate() + 1);
    return d.toISOString();
  })(),
  items: [
    {
      type: 'investigate',
      rank: 1,
      keyword: '돋보기아이',
      prompt: 'A single child holding a large magnifying glass up to one eye, with the eye visibly enlarged and clearly visible through the lens glass — this magnified-eye detail is essential and must be drawn explicitly. Chroma key green background (#00B140), 1:1 square, subject fills 90% of frame, no floor, no shadow. Clean modern flat vector illustration style, natural proportions (not exaggerated chibi), thick confident black outline, subtle gradient/shading for volume (not flat single-tone), no text/letters/numbers in image.',
      hashtags: '돋보기, 관찰, 탐구, 조사, 호기심많은아이, 일러스트, magnifying glass, curious kid, investigate'
    },
    {
      type: 'growth',
      rank: 2,
      keyword: '새싹키우는손',
      prompt: 'A single cupped hand gently cradling a small green sprout with two fresh leaves, soil visibly clinging to the tiny roots where the sprout meets the palm — this hand-to-sprout contact detail is essential and must be drawn explicitly. Chroma key green background (#00B140), 1:1 square, subject fills 90% of frame, no floor, no shadow. Clean modern flat vector illustration style, natural proportions (not exaggerated chibi), thick confident black outline, subtle gradient/shading for volume (not flat single-tone), no text/letters/numbers in image.',
      hashtags: '새싹, 성장, 힐링, 자연, 식물키우기, 일러스트, sprout, growth, healing plant'
    },
    {
      type: 'friendship',
      rank: 3,
      keyword: '강아지와고양이',
      prompt: 'A single dog and cat leaning their bodies against each other, cheek to cheek, with visible fur overlap where they touch — this physical contact detail is essential and must be drawn explicitly. Chroma key green background (#00B140), 1:1 square, subject fills 90% of frame, no floor, no shadow. Clean modern flat vector illustration style, natural proportions (not exaggerated chibi), thick confident black outline, subtle gradient/shading for volume (not flat single-tone), no text/letters/numbers in image.',
      hashtags: '강아지, 고양이, 우정, 반려동물, 친구, 일러스트, dog and cat, friendship, pets'
    },
    {
      type: 'thinking',
      rank: 4,
      keyword: '턱괴고생각하는아이',
      prompt: 'A single child resting their chin on one hand in a thinking pose, with the fingers visibly pressing into the cheek and a faint furrowed brow showing deep thought — this hand-to-face pressure detail is essential and must be drawn explicitly. Chroma key green background (#00B140), 1:1 square, subject fills 90% of frame, no floor, no shadow. Clean modern flat vector illustration style, natural proportions (not exaggerated chibi), thick confident black outline, subtle gradient/shading for volume (not flat single-tone), no text/letters/numbers in image.',
      hashtags: '생각, 고민, 사고, 골똘히생각하는아이, 아이디어, 일러스트, thinking pose, contemplation, kid'
    },
    {
      type: 'discovery',
      rank: 5,
      keyword: '전구켜지는순간',
      prompt: 'A single glowing light bulb with a bright starburst of light rays radiating outward from the filament, the glass surface visibly reflecting the warm glow — this radiating-light detail is essential and must be drawn explicitly. Chroma key green background (#00B140), 1:1 square, subject fills 90% of frame, no floor, no shadow. Clean modern flat vector illustration style, natural proportions (not exaggerated chibi), thick confident black outline, subtle gradient/shading for volume (not flat single-tone), no text/letters/numbers in image.',
      hashtags: '전구, 아이디어, 영감, 발견, 유레카, 일러스트, light bulb, idea, discovery moment'
    }
  ]
};

let currentData = null;
let countdownInterval = null;

// ── UTILS ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── FETCH DATA ──
async function fetchData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  setStatus('loading', '데이터 불러오는 중...');

  try {
    // raw.githubusercontent.com은 Fastly CDN을 거쳐 캐싱되므로(보통 5분 내외),
    // 매 요청마다 다른 쿼리 파라미터를 붙여서 캐시를 강제로 우회함
    const bustedUrl = DATA_URL + '?t=' + Date.now();
    const res = await fetch(bustedUrl, {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    currentData = data;
    renderAll(data);
    setStatus('ok', '데이터 최신 상태');
  } catch (e) {
    console.warn('서버 데이터 없음, 샘플 데이터 사용:', e.message);
    currentData = FALLBACK_DATA;
    renderAll(FALLBACK_DATA);
    setStatus('warn', '에러: ' + e.message);
  } finally {
    btn.classList.remove('spinning');
  }
}

// ── STATUS ──
function setStatus(type, msg) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot' + (type === 'warn' ? ' offline' : '');
  text.textContent = msg;
}

// ── COUNTDOWN ──
function startCountdown(nextUpdateAt) {
  if (countdownInterval) clearInterval(countdownInterval);
  const target = new Date(nextUpdateAt);
  const progressFill = document.querySelector('.progress-fill');
  const countdownEl = document.getElementById('countdown');

  function tick() {
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) { countdownEl.textContent = '갱신 예정!'; return; }
    const totalSec = 24 * 3600;
    const remSec = Math.floor(diff / 1000);
    const pct = ((totalSec - remSec) / totalSec * 100).toFixed(1);
    if (progressFill) progressFill.style.width = pct + '%';
    const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
    const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
    if (countdownEl) countdownEl.textContent = `${h}:${m}:${s}`;
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

// ── RENDER ──
function renderAll(data) {
  document.getElementById('loadingState').style.display = 'none';
  const container = document.getElementById('dataContent');
  container.style.display = 'flex';
  container.innerHTML = '';

  // Update time
  const upd = new Date(data.updatedAt);
  document.getElementById('updateTime').textContent =
    `${upd.getMonth()+1}/${upd.getDate()} ${String(upd.getHours()).padStart(2,'0')}:${String(upd.getMinutes()).padStart(2,'0')} 갱신`;
  document.getElementById('statusRight').textContent =
    `총 ${data.items.length}개 키워드`;

  // Countdown bar
  const countdownEl = document.createElement('div');
  countdownEl.className = 'countdown-bar';
  countdownEl.innerHTML = `
    <span class="countdown-label">다음 갱신까지</span>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <span id="countdown">--:--:--</span>
  `;
  container.appendChild(countdownEl);
  startCountdown(data.nextUpdateAt);

  // Group by type — 판매 데이터 기반 범용 개념 5축
  const groups = [
    { type: 'investigate', badge: 'badge-investigate', label: '🔍 조사·분석·탐구', desc: '승자 사례(돋보기아이) 기반 범용 개념', numCls: 'num-investigate' },
    { type: 'growth',      badge: 'badge-growth',      label: '🌱 성장·발전·힐링', desc: '승자 사례(대나무숲) 기반 범용 개념', numCls: 'num-growth' },
    { type: 'friendship',  badge: 'badge-friendship',  label: '🐾 우정·협업·관계', desc: '승자 사례(개와고양이) 기반 범용 개념', numCls: 'num-friendship' },
    { type: 'thinking',    badge: 'badge-thinking',    label: '🤔 고민·생각·사고', desc: '프레젠테이션 상시 수요 범용 개념', numCls: 'num-thinking' },
    { type: 'discovery',   badge: 'badge-discovery',   label: '💡 발견·아이디어·영감', desc: '프레젠테이션 상시 수요 범용 개념', numCls: 'num-discovery' },
  ];

  groups.forEach(g => {
    const items = data.items.filter(i => i.type === g.type);
    if (!items.length) return;

    const section = document.createElement('div');

    // Section header
    section.innerHTML = `
      <div class="section-header">
        <span class="section-badge ${g.badge}">${g.label}</span>
        <span class="section-desc">${g.desc}</span>
      </div>
    `;

    const cardsWrap = document.createElement('div');
    cardsWrap.style.cssText = 'display:flex;flex-direction:column;gap:10px';

    items.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">
            <span class="card-num ${g.numCls}">${item.rank}</span>
            <span>${escHtml(item.keyword)}</span>
          </div>
          <span class="keyword-tag">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            ${escHtml(item.keyword)}
          </span>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="row-label">Gemini Prompt</div>
            <div class="row-content">
              <div class="text-box">${escHtml(item.prompt)}</div>
              <button class="copy-btn copy-prompt">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                Copy
              </button>
            </div>
          </div>
          <div class="row">
            <div class="row-label">해시태그 (미리캔버스)</div>
            <div class="row-content">
              <div class="text-box" style="font-size:12px;line-height:1.65;color:var(--text-dim)">${escHtml(item.hashtags)}</div>
              <button class="copy-btn copy-hashtag">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                Copy
              </button>
            </div>
          </div>
        </div>
      `;

      // onclick 인라인 대신 addEventListener 사용 (따옴표 충돌 방지)
      card.querySelector('.copy-prompt').addEventListener('click', function() {
        copyText(item.prompt, this);
      });
      card.querySelector('.copy-hashtag').addEventListener('click', function() {
        copyText(item.hashtags, this);
      });

      cardsWrap.appendChild(card);
    });

    section.appendChild(cardsWrap);
    container.appendChild(section);
  });
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── COPY ──
async function copyText(text, btn) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.classList.add('copied');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> 복사됨`;
    showToast('클립보드에 복사됐어! 📋');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
    }, 2000);
  } catch(e) {
    showToast('복사 실패 😢 직접 선택해서 복사해줘');
  }
}

// ── INIT ──
document.getElementById('refreshBtn').onclick = fetchData;
fetchData();
